<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>

    <link rel="stylesheet" href="Carrinho.css">
</head>

<body>

<div class="container">

    <h1>Carrinho de Compras</h1>

    <table>
        <thead>
            <tr>
                <th>Foto</th>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Quantidade</th>
                <th>Preço</th>
            </tr>
        </thead>

        <tbody id="corpo-tabela">

        </tbody>

    </table>

    <div class="resumo-carrinho">

        <div class="resumo-item">
            <strong>Total de itens:</strong>
            <span id="total-itens">0</span>
        </div>

        <div class="resumo-item">
            <strong>Valor Total:</strong>
            R$
            <span id="valor-total">0,00</span>
        </div>

    </div>

    <div class="botoes-container">

        <a href="CardProd.jsx" class="btn-voltar">
            ⬅ Voltar ao Cardápio
        </a>

        <button class="btn-limpar" onclick="limparCarrinho()">
            Limpar Carrinho
        </button>

        <button class="btn-finalizar" onclick="finalizarPedido()">
            Finalizar Pedido
        </button>

    </div>

</div>

<script>

function carregarDadosDoCarrinho(){

    const carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

    const corpoTabela = document.getElementById("corpo-tabela");

    corpoTabela.innerHTML="";

    let totalItens=0;
    let valorTotal=0;

    if(carrinho.length==0){

        corpoTabela.innerHTML=`
        <tr>
            <td colspan="5" class="vazio">
                Seu carrinho está vazio.
            </td>
        </tr>
        `;

    }else{

        carrinho.forEach(item=>{

            totalItens+=item.qtd;

            valorTotal+=item.preco*item.qtd;

            corpoTabela.innerHTML+=`

            <tr>

                <td>
                    <img src="${item.foto}" class="img-produto">
                </td>

                <td>${item.nome}</td>

                <td>${item.categoria}</td>

                <td>${item.qtd}</td>

                <td>
                    R$ ${item.preco.toFixed(2).replace(".",",")}
                </td>

            </tr>

            `;

        });

    }

    document.getElementById("total-itens").innerText=totalItens;

    document.getElementById("valor-total").innerText=valorTotal.toFixed(2).replace(".",",");

}

function limparCarrinho(){

    localStorage.removeItem("carrinho");

    carregarDadosDoCarrinho();

}

function finalizarPedido(){

    const carrinho=JSON.parse(localStorage.getItem("carrinho")) || [];

    if(carrinho.length==0){

        alert("Seu carrinho está vazio!");

        return;

    }

    alert("Pedido enviado com sucesso!");

    limparCarrinho();

}

window.onload=carregarDadosDoCarrinho;

</script>

</body>
</html>
